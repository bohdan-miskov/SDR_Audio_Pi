# --- НАЛАШТУВАННЯ RUFF (Лінтер та Форматер) ---
[tool.ruff]
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# --- НАЛАШТУВАННЯ MYPY (Типізація) ---
[tool.mypy]
python_version = "3.11"
exclude = [".venv", "venv"]
ignore_missing_imports = true

# --- НАЛАШТУВАННЯ DEPTRY (Залежності) ---
[tool.deptry]
extend_exclude = [".venv", "venv", "src/ml/#U0421sv creator.py"]

[tool.deptry.package_module_name_map]
core = "core"
dsp = "dsp"
gui = "gui"
hardware = "hardware"
services = "services"
models = "models"
scanning = "scanning"
utils = "utils"
ml = "ml"
RPi = "RPi"  # Мапимо RPi самого на себе, щоб лінтер вважав його локальним модулем
[tool.deptry.per_rule_ignores]
# Кажемо лінтеру закрити очі на відсутність RPi у файлі антени
DEP001 = ["RPi"]
